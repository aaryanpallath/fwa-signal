[project]
name = "fwa-signal"
version = "0.1.0"
description = "Medicare Part D prescriber outlier detection with a FastAPI service and validated LLM features"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlglot>=25.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
]

[project.scripts]
fwa = "fwa.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL (FWA_DATABASE_URL)", "llm: needs a local Ollama model"]

[tool.ruff]
line-length = 120
